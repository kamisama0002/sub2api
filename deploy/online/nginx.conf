# Optional browser entry. Port 6666 is blocked by Chromium browsers.
# Install as a separate /etc/nginx/conf.d/sub2api-online.conf file.
# For a public domain, configure a TLS virtual host forwarding to the same upstream.
server {
    listen 6660;
    server_name _;
    client_max_body_size 256m;

    location / {
        proxy_pass http://127.0.0.1:6666;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_buffering off;
    }
}
